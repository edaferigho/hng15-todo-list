<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern, accessible to-do list app built with React, TypeScript, Vite and Tailwind CSS."
    />
    <title>TaskFlow — To-Do List</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of light mode.
      ;(function () {
        try {
          var stored = localStorage.getItem('taskflow.theme.v1')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          /* localStorage unavailable — fall back to defaults */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
